# Official NVFP4-aligned fake-quant recipe (TE / Blackwell):
#   x = E2M1 * s_block(FP8 E4M3, group=16) * s_global(FP32, per-tensor)
# Applies the same two-level hierarchy to BOTH weights and activations.
# Differs from nvfp4.yaml: explicit torch.float32 tensor scale (not null/bf16),
# and activations also get the FP32 per-tensor level.
quant:
  wgts:
    dtype: sfp4_e2m1_all
    group_shapes:
    - - -1
      - -1
    - - 1
      - 16
      - 1
      - 1
      - 1
    scale_dtypes:
    - torch.float32
    - sfp8_e4m3_nan
  ipts:
    static: false
    dtype: sfp4_e2m1_all
    group_shapes:
    - - -1
      - -1
    - - 1
      - 16
      - 1
      - 1
      - 1
    scale_dtypes:
    - torch.float32
    - sfp8_e4m3_nan
  enable_extra_wgts: true
  extra_wgts:
    dtype: sint4
    group_shapes:
    - - 1
      - 64
      - 1
      - 1
      - 1
    scale_dtypes:
    - null
    includes:
    - transformer_norm
    - transformer_add_norm
